<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Глобус: тест</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; left: 12px; top: 12px; padding: 12px; background: rgba(10,10,14,.75); border: 1px solid #333; border-radius: 6px; display: grid; gap: 8px; min-width: 240px; }
  button { background: #1a1a20; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: #c33; }
  #fps, #log { font-family: ui-monospace, monospace; font-size: 12px; color: #9a9; }
</style>
</head>
<body>
<div id="panel">
  <label for="silk">Шёлк: <span id="silkVal">0.00</span></label>
  <input id="silk" type="range" min="0" max="1" step="0.01" value="0" />
  <button id="kill" type="button">Погасить случайный город</button>
  <button id="thread" type="button">Добавить нить</button>
  <div id="fps">FPS: …</div>
  <div id="log" aria-live="polite"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { Globe } from '../src/render/Globe.js';
import { CITIES } from '../src/content/cities.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
camera.position.set(0, 0.6, 3.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 1.3; controls.maxDistance = 8;

const globe = new Globe(scene);
window.__globe = globe;

const log = document.getElementById('log');
const lit = new Set(CITIES.map((c) => c.id));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

document.getElementById('silk').addEventListener('input', (e) => {
  const v = Number(e.target.value);
  globe.setSilk(v);
  document.getElementById('silkVal').textContent = v.toFixed(2);
});
document.getElementById('kill').addEventListener('click', () => {
  if (!lit.size) { log.textContent = 'Все города погашены'; return; }
  const id = pick([...lit]);
  lit.delete(id);
  globe.setCityLight(id, 0);
  log.textContent = 'Гаснет: ' + CITIES.find((c) => c.id === id).name + ' (горит ' + lit.size + ')';
});
document.getElementById('thread').addEventListener('click', () => {
  const a = pick(CITIES), b = pick(CITIES.filter((c) => c !== a));
  globe.addThread(a.id, b.id);
  log.textContent = 'Нить: ' + a.name + ' → ' + b.name;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let frames = 0, acc = 0;
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  globe.update(dt);
  controls.update();
  renderer.render(scene, camera);
  frames++; acc += dt;
  if (acc >= 1) { document.getElementById('fps').textContent = 'FPS: ' + Math.round(frames / acc); frames = 0; acc = 0; }
});
</script>
</body>
</html>
